[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srtflow"
version = "0.3.0"
description = "Resumable video transcription and subtitle translation CLI"
requires-python = ">=3.11"
dependencies = ["rich>=13.7,<15"]

[project.scripts]
srtflow = "srtflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
